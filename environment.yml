name: nocitis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy<2         
  - pandas>=1.5
  - matplotlib>=3.7
  - scikit-learn>=1.2
  - pvlib>=0.10
  - xarray>=2023.1
  - gdal>=3.6
  - pip
  - pip:
      - torch
      - torchvision
      - lightning>=2.1
      - einops>=0.7
      - timm>=0.9
      - neuraloperator
      - opencv-python
      # --- Other tools ---
      - kornia>=0.7
      - segmentation-models-pytorch>=0.3
      - cdsapi
      - -e .